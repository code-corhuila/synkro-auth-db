name: db-ci

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

jobs:
  migration-rebuild:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_admin_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/postgres
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ci_admin_pw
      PGPASSWORD: ci_admin_pw
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Simulate bootstrap — create the auth_app login role
        # The real bootstrap script lives in synkro-infra-postgres
        # (ADR-012 Decision 1), not built yet. This step stands in for it,
        # in CI only. It is NOT how production bootstrap actually works —
        # do not copy this step's approach into real infrastructure code.
        run: |
          psql -h localhost -U postgres -c \
            "CREATE ROLE auth_app LOGIN PASSWORD 'ci_app_pw';"

      - name: Install Flyway — the same image deploy/compose.yml runs
        # Flyway stopped publishing the CLI tarball to Maven Central after
        # 11.8.x, so CI runs the official image through a thin wrapper.
        # Keep this tag identical to deploy/compose.yml: CI must prove the
        # exact runner that deploys.
        run: |
          docker pull flyway/flyway:11.20.3-alpine
          # The repository is copied in with `docker cp` rather than
          # bind-mounted, so the wrapper works whether or not the Docker
          # daemon can see the job's filesystem (containerized runners, act).
          sudo tee /usr/local/bin/flyway > /dev/null <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cid=$(docker create --network host \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            flyway/flyway:11.20.3-alpine -workingDirectory=/workspace "$@")
          trap 'docker rm -f "$cid" > /dev/null' EXIT
          docker cp -q "$PWD/." "$cid:/workspace"
          docker start -a "$cid"
          exit "$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
          SH
          sudo chmod +x /usr/local/bin/flyway
          flyway version

      - name: Migrate from empty — every V migration must be applied
        # A missing config or location makes Flyway "succeed" with zero
        # migrations, so success alone proves nothing: count them.
        run: |
          flyway -configFiles=flyway.toml migrate
          expected=$(find 01_ddl 02_dml 03_dcl 04_tcl -name 'V*.sql' | wc -l)
          applied=$(psql -h localhost -U postgres -d postgres -tAc \
            "SELECT count(*) FROM flyway_schema_history WHERE success AND version IS NOT NULL;")
          echo "V migrations in repository: $expected, applied: $applied"
          if [ "$expected" -eq 0 ] || [ "$applied" != "$expected" ]; then
            echo "Applied migrations do not match the repository"
            exit 1
          fi

      - name: Migrate again — must report no migration necessary
        run: |
          output=$(flyway -configFiles=flyway.toml migrate)
          echo "$output"
          echo "$output" | grep -q "No migration necessary" \
            || (echo "Second migrate was not a no-op" && exit 1)

      - name: Privilege check — auth_app can use auth_schema
        run: |
          result=$(psql -h localhost -U postgres -d postgres -tAc \
            "SELECT has_schema_privilege('auth_app', 'auth_schema', 'USAGE');")
          if [ "$result" != "t" ]; then
            echo "auth_app lacks USAGE on auth_schema"
            exit 1
          fi

      - name: Role check — auth_reader reads, cannot write, is not granted to auth_app
        # auth_reader is deliberately not granted to auth_app: no service reads
        # auth_schema through it yet. The probe table stands in for system_user,
        # which V006 creates later, to prove V005's default SELECT reaches tables
        # that the migration user creates in auth_schema.
        run: |
          set -euo pipefail
          # -q drops the command tags (SET, DROP ...) that would pollute a value
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "auth_reader exists" \
            "SELECT count(*) FROM pg_roles WHERE rolname = 'auth_reader';" 1
          expect_eq "auth_reader is NOLOGIN" \
            "SELECT rolcanlogin FROM pg_roles WHERE rolname = 'auth_reader';" f
          expect_eq "auth_reader has USAGE on auth_schema" \
            "SELECT has_schema_privilege('auth_reader', 'auth_schema', 'USAGE');" t
          expect_eq "auth_app is not a member of auth_reader" \
            "SELECT pg_has_role('auth_app', 'auth_reader', 'MEMBER');" f

          $PSQL -c "CREATE TABLE auth_schema.probe_auth_reader (id integer);"
          expect_eq "auth_reader can SELECT a table created in auth_schema" \
            "SET ROLE auth_reader; SELECT count(*) FROM auth_schema.probe_auth_reader;" 0

          out=$($PSQL -tAc "SET ROLE auth_reader; INSERT INTO auth_schema.probe_auth_reader VALUES (1);" 2>&1 || true)
          if ! grep -q "permission denied for table probe_auth_reader" <<< "$out"; then
            echo "FAIL: auth_reader must not INSERT, got:"; echo "$out"; exit 1
          fi
          echo "PASS: auth_reader cannot INSERT"

          $PSQL -c "DROP TABLE auth_schema.probe_auth_reader;"

      - name: Privilege check — system_user grants for auth_app, auth_writer and auth_reader
        # auth_app has no grant of its own on system_user: INSERT and UPDATE reach
        # it through auth_writer, and nobody holds DELETE. The owner check proves
        # that the role owning the table is the one that set auth_schema's default
        # privileges (V003, V005), so a migration run by another role would fail here.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "system_user exists in auth_schema" \
            "SELECT to_regclass('auth_schema.system_user') IS NOT NULL;" t
          expect_eq "auth_app can SELECT system_user" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.system_user', 'SELECT');" t
          expect_eq "auth_app can INSERT system_user" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.system_user', 'INSERT');" t
          expect_eq "auth_app can UPDATE system_user" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.system_user', 'UPDATE');" t
          expect_eq "auth_app cannot DELETE system_user" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.system_user', 'DELETE');" f
          expect_eq "auth_app is a member of auth_writer" \
            "SELECT pg_has_role('auth_app', 'auth_writer', 'MEMBER');" t
          expect_eq "auth_app has no direct grant on system_user" \
            "SELECT count(*) FROM pg_class c CROSS JOIN LATERAL aclexplode(c.relacl) a JOIN pg_roles r ON r.oid = a.grantee WHERE c.oid = 'auth_schema.system_user'::regclass AND r.rolname = 'auth_app';" 0
          expect_eq "auth_writer cannot DELETE system_user" \
            "SELECT has_table_privilege('auth_writer', 'auth_schema.system_user', 'DELETE');" f
          expect_eq "auth_reader can SELECT system_user" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.system_user', 'SELECT');" t
          expect_eq "auth_reader cannot INSERT system_user" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.system_user', 'INSERT');" f
          expect_eq "the role that owns system_user also set auth_schema's default privileges" \
            "SELECT pg_get_userbyid(c.relowner) = pg_get_userbyid(d.defaclrole) FROM pg_class c, pg_default_acl d JOIN pg_namespace n ON n.oid = d.defaclnamespace WHERE c.oid = 'auth_schema.system_user'::regclass AND n.nspname = 'auth_schema' AND d.defaclobjtype = 'r';" t

      - name: Constraint checks — system_user rejects bad rows for the right reason
        # A rejected INSERT proves nothing by itself: each rejection must carry its
        # SQLSTATE and the constraint or column it breaks, and each valid row must
        # still be accepted. Placeholder hashes only: no value here is a secret.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES
            ('Ada Admin', 'admin@synkro.test', 'placeholder-not-a-hash', 'ADMIN'),
            ('Sam Sales', 'sales@synkro.test', 'placeholder-not-a-hash', 'SALESPERSON'),
            ('Ivy Inventory', 'inventory@synkro.test', 'placeholder-not-a-hash', 'INVENTORY');" \
            "one user for each of ADMIN, SALESPERSON and INVENTORY"
          expect_eq "defaults are generated: user_id, registration_date and active = true" \
            "SELECT count(DISTINCT user_id) FROM auth_schema.system_user WHERE active AND registration_date > now() - interval '1 hour';" 3

          expect_violation 23514 chk_system_user_role \
            "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Service Role', 'service@synkro.test', 'placeholder-not-a-hash', 'SERVICE');"
          expect_violation 23514 chk_system_user_role \
            "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Owner Role', 'owner@synkro.test', 'placeholder-not-a-hash', 'OWNER');"

          expect_violation 23505 uq_system_user_email \
            "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Dup Admin', 'admin@synkro.test', 'placeholder-not-a-hash', 'ADMIN');"

          expect_violation 23514 chk_system_user_name_length \
            "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('', 'name-zero@synkro.test', 'placeholder-not-a-hash', 'ADMIN');"
          expect_violation 23514 chk_system_user_name_length \
            "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES (repeat('n', 151), 'name-151@synkro.test', 'placeholder-not-a-hash', 'ADMIN');"
          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('N', 'name-one@synkro.test', 'placeholder-not-a-hash', 'ADMIN');" \
            "name of 1 character"
          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES (repeat('n', 150), 'name-150@synkro.test', 'placeholder-not-a-hash', 'ADMIN');" \
            "name of 150 characters"

          expect_violation 23514 chk_system_user_email_length \
            "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Email Two', 'ab', 'placeholder-not-a-hash', 'ADMIN');"
          expect_violation 23514 chk_system_user_email_length \
            "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Email 256', repeat('e', 243) || '@example.test', 'placeholder-not-a-hash', 'ADMIN');"
          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Email Three', 'a@b', 'placeholder-not-a-hash', 'ADMIN');" \
            "email of 3 characters"
          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Email 255', repeat('e', 242) || '@example.test', 'placeholder-not-a-hash', 'ADMIN');" \
            "email of 255 characters"

          # Every required column rejects NULL: SQLSTATE 23502, named by its column
          declare -A VALUE=(
            [user_id]="gen_random_uuid()"
            [name]="'Null Name'"
            [email]="'null-check@synkro.test'"
            [password_hash]="'placeholder-not-a-hash'"
            [role]="'ADMIN'"
            [registration_date]="now()"
            [active]="true"
          )
          columns="user_id, name, email, password_hash, role, registration_date, active"
          for null_column in user_id name email password_hash role registration_date active; do
            values=""
            for column in user_id name email password_hash role registration_date active; do
              value="${VALUE[$column]}"
              if [ "$column" = "$null_column" ]; then value="NULL"; fi
              values+="${values:+, }$value"
            done
            expect_violation 23502 "$null_column" \
              "INSERT INTO auth_schema.system_user ($columns) VALUES ($values);"
          done

          # Clean up every row this step accepted
          $PSQL -c "DELETE FROM auth_schema.system_user;"
          expect_eq "system_user is empty after the checks" \
            "SELECT count(*) FROM auth_schema.system_user;" 0

      - name: Privilege check — refresh_token grants for auth_app, auth_writer and auth_reader
        # auth_app reaches refresh_token through auth_writer, as it does system_user,
        # and nobody holds DELETE: a token is deactivated, never removed.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "refresh_token exists in auth_schema" \
            "SELECT to_regclass('auth_schema.refresh_token') IS NOT NULL;" t
          expect_eq "auth_app can SELECT refresh_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.refresh_token', 'SELECT');" t
          expect_eq "auth_app can INSERT refresh_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.refresh_token', 'INSERT');" t
          expect_eq "auth_app can UPDATE refresh_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.refresh_token', 'UPDATE');" t
          expect_eq "auth_app cannot DELETE refresh_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.refresh_token', 'DELETE');" f
          expect_eq "auth_app has no direct grant on refresh_token" \
            "SELECT count(*) FROM pg_class c CROSS JOIN LATERAL aclexplode(c.relacl) a JOIN pg_roles r ON r.oid = a.grantee WHERE c.oid = 'auth_schema.refresh_token'::regclass AND r.rolname = 'auth_app';" 0
          expect_eq "auth_writer cannot DELETE refresh_token" \
            "SELECT has_table_privilege('auth_writer', 'auth_schema.refresh_token', 'DELETE');" f
          expect_eq "auth_reader can SELECT refresh_token" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.refresh_token', 'SELECT');" t
          expect_eq "auth_reader cannot INSERT refresh_token" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.refresh_token', 'INSERT');" f
          expect_eq "the role that owns refresh_token also set auth_schema's default privileges" \
            "SELECT pg_get_userbyid(c.relowner) = pg_get_userbyid(d.defaclrole) FROM pg_class c, pg_default_acl d JOIN pg_namespace n ON n.oid = d.defaclnamespace WHERE c.oid = 'auth_schema.refresh_token'::regclass AND n.nspname = 'auth_schema' AND d.defaclobjtype = 'r';" t

      - name: Constraint checks — refresh_token rejects bad rows and is cleaned up
        # Each rejection carries its SQLSTATE and the constraint or column it breaks,
        # next to a valid control. Placeholder tokens only: no real token or hash here.
        # The owner is a system_user this step creates, and deletes after its tokens.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Tia Token', 'token-owner@synkro.test', 'placeholder-not-a-hash', 'ADMIN');" \
            "a user to own the tokens"
          expect_accepted "INSERT INTO auth_schema.refresh_token (user_id, token, expiration_date) SELECT user_id, 'placeholder-token-hash-1', now() + interval '7 days' FROM auth_schema.system_user WHERE email = 'token-owner@synkro.test';" \
            "a token for an existing user, with token_id and active left to their defaults"
          expect_eq "defaults are generated: token_id is set and active = true" \
            "SELECT count(*) FROM auth_schema.refresh_token WHERE active AND token_id IS NOT NULL;" 1

          expect_violation 23505 uq_refresh_token_token \
            "INSERT INTO auth_schema.refresh_token (user_id, token, expiration_date) SELECT user_id, 'placeholder-token-hash-1', now() + interval '7 days' FROM auth_schema.system_user WHERE email = 'token-owner@synkro.test';"
          expect_accepted "INSERT INTO auth_schema.refresh_token (user_id, token, expiration_date) SELECT user_id, 'placeholder-token-hash-2', now() + interval '7 days' FROM auth_schema.system_user WHERE email = 'token-owner@synkro.test';" \
            "a second token with a different hash"

          # Every required column rejects NULL: SQLSTATE 23502, named by its column
          declare -A VALUE=(
            [user_id]="(SELECT user_id FROM auth_schema.system_user WHERE email = 'token-owner@synkro.test')"
            [token]="'placeholder-token-hash-3'"
            [expiration_date]="now() + interval '7 days'"
          )
          columns="user_id, token, expiration_date"
          for null_column in user_id token expiration_date; do
            values=""
            for column in user_id token expiration_date; do
              value="${VALUE[$column]}"
              if [ "$column" = "$null_column" ]; then value="NULL"; fi
              values+="${values:+, }$value"
            done
            expect_violation 23502 "$null_column" \
              "INSERT INTO auth_schema.refresh_token ($columns) VALUES ($values);"
          done

          # The owner must exist; a user that owns a token cannot be deleted
          expect_violation 23503 fk_refresh_token_user \
            "INSERT INTO auth_schema.refresh_token (user_id, token, expiration_date) VALUES ('99999999-9999-9999-9999-999999999999', 'placeholder-token-hash-4', now() + interval '7 days');"
          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Idle User', 'idle@synkro.test', 'placeholder-not-a-hash', 'INVENTORY');" \
            "a user that owns no token"
          expect_violation 23503 fk_refresh_token_user \
            "DELETE FROM auth_schema.system_user WHERE email = 'token-owner@synkro.test';"
          expect_accepted "DELETE FROM auth_schema.system_user WHERE email = 'idle@synkro.test';" \
            "deleting a user that owns no token"

          # Children before parents: the foreign key forbids the reverse order
          $PSQL -c "DELETE FROM auth_schema.refresh_token;"
          $PSQL -c "DELETE FROM auth_schema.system_user;"
          expect_eq "refresh_token is empty after the checks" \
            "SELECT count(*) FROM auth_schema.refresh_token;" 0
          expect_eq "system_user is empty after the checks" \
            "SELECT count(*) FROM auth_schema.system_user;" 0

      - name: Index check — refresh_token is indexed by user, and every foreign key has an index
        # A foreign key without an index makes each delete of its parent scan the child
        # table. The query covers every foreign key of auth_schema, so the keys that
        # HU-AUTH-06 adds are checked without changing this step.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "idx_refresh_token_user_id is on refresh_token (user_id)" \
            "SELECT coalesce(pg_get_indexdef(to_regclass('auth_schema.idx_refresh_token_user_id')), '<none>');" \
            "CREATE INDEX idx_refresh_token_user_id ON auth_schema.refresh_token USING btree (user_id)"
          # Without this guard the next check passes when there are no foreign keys at all
          expect_eq "auth_schema has foreign keys to check" \
            "SELECT count(*) > 0 FROM pg_constraint c JOIN pg_namespace n ON n.oid = c.connamespace WHERE c.contype = 'f' AND n.nspname = 'auth_schema';" t
          expect_eq "every foreign key of auth_schema has an index starting with its column" \
            "SELECT coalesce(string_agg(c.conname, ', ' ORDER BY c.conname), '') FROM pg_constraint c JOIN pg_namespace n ON n.oid = c.connamespace WHERE c.contype = 'f' AND n.nspname = 'auth_schema' AND NOT EXISTS (SELECT 1 FROM pg_index i WHERE i.indrelid = c.conrelid AND i.indkey[0] = c.conkey[1]);" \
            ""

      - name: Privilege check — service_token grants for auth_app, auth_writer and auth_reader
        # Same grants as refresh_token: auth_app reaches the table through auth_writer,
        # and nobody holds DELETE. A service token's metadata is kept, never removed.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "service_token exists in auth_schema" \
            "SELECT to_regclass('auth_schema.service_token') IS NOT NULL;" t
          expect_eq "auth_app can SELECT service_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.service_token', 'SELECT');" t
          expect_eq "auth_app can INSERT service_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.service_token', 'INSERT');" t
          expect_eq "auth_app can UPDATE service_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.service_token', 'UPDATE');" t
          expect_eq "auth_app cannot DELETE service_token" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.service_token', 'DELETE');" f
          expect_eq "auth_app has no direct grant on service_token" \
            "SELECT count(*) FROM pg_class c CROSS JOIN LATERAL aclexplode(c.relacl) a JOIN pg_roles r ON r.oid = a.grantee WHERE c.oid = 'auth_schema.service_token'::regclass AND r.rolname = 'auth_app';" 0
          expect_eq "auth_writer cannot DELETE service_token" \
            "SELECT has_table_privilege('auth_writer', 'auth_schema.service_token', 'DELETE');" f
          expect_eq "auth_reader can SELECT service_token" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.service_token', 'SELECT');" t
          expect_eq "auth_reader cannot INSERT service_token" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.service_token', 'INSERT');" f
          expect_eq "the role that owns service_token also set auth_schema's default privileges" \
            "SELECT pg_get_userbyid(c.relowner) = pg_get_userbyid(d.defaclrole) FROM pg_class c, pg_default_acl d JOIN pg_namespace n ON n.oid = d.defaclnamespace WHERE c.oid = 'auth_schema.service_token'::regclass AND n.nspname = 'auth_schema' AND d.defaclobjtype = 'r';" t

      - name: Constraint checks — service_token rejects bad rows and is cleaned up
        # Each rejection carries its SQLSTATE and the constraint or column it breaks,
        # next to a valid control. Placeholder data only: no real token or hash here.
        # The issuer is an ADMIN this step creates, and deletes after its tokens.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Sia Service', 'service-issuer@synkro.test', 'placeholder-not-a-hash', 'ADMIN');" \
            "an ADMIN to issue the tokens"

          # token_id has no default: it is the jti that the domain generates.
          # issued_at keeps its default in these two rows.
          expect_accepted "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, expires_at) SELECT gen_random_uuid(), 'synkro-workflow', ARRAY['customers:read', 'stock:reserve', 'stock:release', 'sales:register'], user_id, now() + interval '30 days' FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test';" \
            "a token for synkro-workflow, issued by an ADMIN"
          expect_accepted "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, expires_at) SELECT gen_random_uuid(), 'synkro-worker', ARRAY['products:read', 'stock-alerts:read', 'stock-alerts:write'], user_id, now() + interval '30 days' FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test';" \
            "a token for synkro-worker, issued by an ADMIN"
          expect_eq "defaults are generated: issued_at is set to now" \
            "SELECT count(*) FROM auth_schema.service_token WHERE issued_at > now() - interval '1 minute';" 2

          expect_violation 23514 chk_service_token_service \
            "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, expires_at) SELECT gen_random_uuid(), 'synkro-sales-api', ARRAY['sales:register'], user_id, now() + interval '30 days' FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test';"

          expect_violation 23514 chk_service_token_expiry \
            "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, issued_at, expires_at) SELECT gen_random_uuid(), 'synkro-worker', ARRAY['products:read'], user_id, now(), now() FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test';"
          expect_violation 23514 chk_service_token_expiry \
            "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, issued_at, expires_at) SELECT gen_random_uuid(), 'synkro-worker', ARRAY['products:read'], user_id, now(), now() - interval '1 second' FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test';"
          expect_accepted "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, issued_at, expires_at) SELECT gen_random_uuid(), 'synkro-worker', ARRAY['products:read'], user_id, now(), now() + interval '1 day' FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test';" \
            "an expiry one day after the issue"

          expect_violation 23502 token_id \
            "INSERT INTO auth_schema.service_token (service, permissions, issued_by, expires_at) SELECT 'synkro-worker', ARRAY['products:read'], user_id, now() + interval '30 days' FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test';"

          # Every required column rejects NULL: SQLSTATE 23502, named by its column
          declare -A VALUE=(
            [token_id]="gen_random_uuid()"
            [service]="'synkro-workflow'"
            [permissions]="ARRAY['customers:read']"
            [issued_by]="(SELECT user_id FROM auth_schema.system_user WHERE email = 'service-issuer@synkro.test')"
            [expires_at]="now() + interval '30 days'"
          )
          columns="token_id, service, permissions, issued_by, expires_at"
          for null_column in token_id service permissions issued_by expires_at; do
            values=""
            for column in token_id service permissions issued_by expires_at; do
              value="${VALUE[$column]}"
              if [ "$column" = "$null_column" ]; then value="NULL"; fi
              values+="${values:+, }$value"
            done
            expect_violation 23502 "$null_column" \
              "INSERT INTO auth_schema.service_token ($columns) VALUES ($values);"
          done

          # A repeated token_id is the same jti: the primary key refuses it
          expect_violation 23505 pk_service_token \
            "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, expires_at) SELECT token_id, 'synkro-worker', ARRAY['products:read'], issued_by, now() + interval '30 days' FROM auth_schema.service_token WHERE service = 'synkro-workflow' LIMIT 1;"

          # Children before parents: the reverse order is refused once the foreign key exists
          $PSQL -c "DELETE FROM auth_schema.service_token;"
          $PSQL -c "DELETE FROM auth_schema.system_user;"
          expect_eq "service_token is empty after the checks" \
            "SELECT count(*) FROM auth_schema.service_token;" 0
          expect_eq "system_user is empty after the checks" \
            "SELECT count(*) FROM auth_schema.system_user;" 0

      - name: Privilege check — idempotency_key grants for auth_app, auth_writer and auth_reader
        # Same grants as the other tables: auth_app reaches the table through auth_writer,
        # and nobody holds DELETE. A used key stays, so a retry can find it.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "idempotency_key exists in auth_schema" \
            "SELECT to_regclass('auth_schema.idempotency_key') IS NOT NULL;" t
          expect_eq "auth_app can SELECT idempotency_key" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.idempotency_key', 'SELECT');" t
          expect_eq "auth_app can INSERT idempotency_key" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.idempotency_key', 'INSERT');" t
          expect_eq "auth_app can UPDATE idempotency_key" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.idempotency_key', 'UPDATE');" t
          expect_eq "auth_app cannot DELETE idempotency_key" \
            "SELECT has_table_privilege('auth_app', 'auth_schema.idempotency_key', 'DELETE');" f
          expect_eq "auth_app has no direct grant on idempotency_key" \
            "SELECT count(*) FROM pg_class c CROSS JOIN LATERAL aclexplode(c.relacl) a JOIN pg_roles r ON r.oid = a.grantee WHERE c.oid = 'auth_schema.idempotency_key'::regclass AND r.rolname = 'auth_app';" 0
          expect_eq "auth_writer cannot DELETE idempotency_key" \
            "SELECT has_table_privilege('auth_writer', 'auth_schema.idempotency_key', 'DELETE');" f
          expect_eq "auth_reader can SELECT idempotency_key" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.idempotency_key', 'SELECT');" t
          expect_eq "auth_reader cannot INSERT idempotency_key" \
            "SELECT has_table_privilege('auth_reader', 'auth_schema.idempotency_key', 'INSERT');" f
          expect_eq "the role that owns idempotency_key also set auth_schema's default privileges" \
            "SELECT pg_get_userbyid(c.relowner) = pg_get_userbyid(d.defaclrole) FROM pg_class c, pg_default_acl d JOIN pg_namespace n ON n.oid = d.defaclnamespace WHERE c.oid = 'auth_schema.idempotency_key'::regclass AND n.nspname = 'auth_schema' AND d.defaclobjtype = 'r';" t

      - name: Constraint checks — idempotency_key rejects bad keys and is cleaned up
        # Each rejection carries its SQLSTATE and the constraint or column it breaks,
        # next to a valid control. Placeholder keys only: they are not secrets.
        # The table has no foreign key: resource_id names a user or a token by type,
        # so the rows of this step need no parent row.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "idempotency_key has no foreign key" \
            "SELECT count(*) FROM pg_constraint WHERE conrelid = 'auth_schema.idempotency_key'::regclass AND contype = 'f';" 0

          expect_accepted "INSERT INTO auth_schema.idempotency_key (key, resource_type, resource_id) VALUES (repeat('a', 8), 'USER', gen_random_uuid());" \
            "a key of 8 characters for a USER"
          expect_accepted "INSERT INTO auth_schema.idempotency_key (key, resource_type, resource_id) VALUES (repeat('b', 128), 'SERVICE_TOKEN', gen_random_uuid());" \
            "a key of 128 characters for a SERVICE_TOKEN"
          expect_eq "defaults are generated: created_at is set to now" \
            "SELECT count(*) FROM auth_schema.idempotency_key WHERE created_at > now() - interval '1 minute';" 2

          expect_violation 23514 chk_idempotency_key_length \
            "INSERT INTO auth_schema.idempotency_key (key, resource_type, resource_id) VALUES (repeat('c', 7), 'USER', gen_random_uuid());"
          expect_violation 23514 chk_idempotency_key_length \
            "INSERT INTO auth_schema.idempotency_key (key, resource_type, resource_id) VALUES (repeat('d', 129), 'SERVICE_TOKEN', gen_random_uuid());"

          expect_violation 23514 chk_idempotency_key_resource_type \
            "INSERT INTO auth_schema.idempotency_key (key, resource_type, resource_id) VALUES (repeat('e', 8), 'SERVICE', gen_random_uuid());"

          # A repeated key is refused: the key is the primary key
          expect_violation 23505 pk_idempotency_key \
            "INSERT INTO auth_schema.idempotency_key (key, resource_type, resource_id) VALUES (repeat('a', 8), 'USER', gen_random_uuid());"

          # Every required column rejects NULL: SQLSTATE 23502, named by its column
          declare -A VALUE=(
            [key]="repeat('f', 8)"
            [resource_type]="'USER'"
            [resource_id]="gen_random_uuid()"
          )
          columns="key, resource_type, resource_id"
          for null_column in key resource_type resource_id; do
            values=""
            for column in key resource_type resource_id; do
              value="${VALUE[$column]}"
              if [ "$column" = "$null_column" ]; then value="NULL"; fi
              values+="${values:+, }$value"
            done
            expect_violation 23502 "$null_column" \
              "INSERT INTO auth_schema.idempotency_key ($columns) VALUES ($values);"
          done

          # Clean up every row this step accepted
          $PSQL -c "DELETE FROM auth_schema.idempotency_key;"
          expect_eq "idempotency_key is empty after the checks" \
            "SELECT count(*) FROM auth_schema.idempotency_key;" 0

      - name: Constraint checks — service_token issuer foreign key is enforced
        # The issuer must exist, and an ADMIN who issued a token cannot be deleted
        # while the token exists: RESTRICT, not CASCADE. Placeholder data only.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Fay Foreign', 'fk-issuer@synkro.test', 'placeholder-not-a-hash', 'ADMIN');" \
            "an ADMIN who will issue a token"
          expect_accepted "INSERT INTO auth_schema.system_user (name, email, password_hash, role) VALUES ('Ivo Idle', 'fk-idle@synkro.test', 'placeholder-not-a-hash', 'INVENTORY');" \
            "a user that issues no token"
          expect_accepted "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, expires_at) SELECT gen_random_uuid(), 'synkro-workflow', ARRAY['sales:register'], user_id, now() + interval '30 days' FROM auth_schema.system_user WHERE email = 'fk-issuer@synkro.test';" \
            "a token issued by an existing ADMIN"

          expect_violation 23503 fk_service_token_issued_by \
            "INSERT INTO auth_schema.service_token (token_id, service, permissions, issued_by, expires_at) VALUES (gen_random_uuid(), 'synkro-worker', ARRAY['products:read'], '99999999-9999-9999-9999-999999999999', now() + interval '30 days');"
          expect_violation 23503 fk_service_token_issued_by \
            "DELETE FROM auth_schema.system_user WHERE email = 'fk-issuer@synkro.test';"
          expect_accepted "DELETE FROM auth_schema.system_user WHERE email = 'fk-idle@synkro.test';" \
            "deleting a user that issued no token"

          # Children before parents: the foreign key forbids the reverse order
          $PSQL -c "DELETE FROM auth_schema.service_token;"
          $PSQL -c "DELETE FROM auth_schema.system_user;"
          expect_eq "service_token is empty after the checks" \
            "SELECT count(*) FROM auth_schema.service_token;" 0
          expect_eq "system_user is empty after the checks" \
            "SELECT count(*) FROM auth_schema.system_user;" 0

      - name: Index check — service_token is indexed by its issuer
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          expect_eq "idx_service_token_issued_by is on service_token (issued_by)" \
            "SELECT coalesce(pg_get_indexdef(to_regclass('auth_schema.idx_service_token_issued_by')), '<none>');" \
            "CREATE INDEX idx_service_token_issued_by ON auth_schema.service_token USING btree (issued_by)"

      - name: Privilege check — auth_app cannot DELETE from any table of auth_schema
        # Schema-wide: the query reads the ordinary tables of auth_schema from the catalog,
        # so a table added later is checked without editing this step. has_table_privilege
        # counts grants inherited through auth_writer and PUBLIC, which aclexplode does not.
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -q -v ON_ERROR_STOP=1"

          source .github/scripts/db-checks.sh

          # Without this guard the next check passes when the schema has no table at all
          expect_eq "auth_schema has tables to check" \
            "SELECT count(*) > 0 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'auth_schema' AND c.relkind = 'r';" t
          expect_eq "auth_app cannot DELETE from any table of auth_schema" \
            "SELECT coalesce(string_agg(c.relname, ', ' ORDER BY c.relname), '') FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'auth_schema' AND c.relkind = 'r' AND has_table_privilege('auth_app', c.oid, 'DELETE');" \
            ""

      - name: Apply rollbacks, highest version to lowest
        run: |
          set -euo pipefail
          find 05_rollbacks -name 'U*.sql' -printf '%f\t%p\n' \
            | sort -r \
            | cut -f2 \
            | while read -r f; do
                echo "Applying $f"
                psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
              done

      - name: Confirm auth_schema, auth_writer and auth_reader no longer exist
        run: |
          result=$(psql -h localhost -U postgres -d postgres -tAc \
            "SELECT 1 FROM information_schema.schemata WHERE schema_name = 'auth_schema';")
          if [ -n "$result" ]; then
            echo "auth_schema still exists after applying all rollbacks"
            exit 1
          fi
          result=$(psql -h localhost -U postgres -d postgres -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'auth_writer';")
          if [ -n "$result" ]; then
            echo "auth_writer still exists after applying all rollbacks"
            exit 1
          fi
          result=$(psql -h localhost -U postgres -d postgres -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'auth_reader';")
          if [ -n "$result" ]; then
            echo "auth_reader still exists after applying all rollbacks"
            exit 1
          fi

      - name: Drop flyway_schema_history and migrate again
        run: |
          psql -h localhost -U postgres -d postgres -c \
            "DROP TABLE IF EXISTS flyway_schema_history;"
          flyway -configFiles=flyway.toml migrate
