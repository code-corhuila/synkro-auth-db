          # A repeated key is refused: the key is the primary key
          expect_violation 23505 pk_idempotency_key \
            "INSERT INTO auth_schema.idempotency_key (key, resource_type, resource_id) VALUES (repeat('a', 8), 'USER', gen_random_uuid());"

          # Every required column rejects NULL: SQLSTATE 23502, named by its column
          declare -A VALUE=(
